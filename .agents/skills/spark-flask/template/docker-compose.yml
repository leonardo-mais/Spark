services:
  web:
    build: .
    container_name: spark-flask-app
    restart: unless-stopped
    ports:
      - "${SPARK_FLASK_PORT:-8080}:${SPARK_FLASK_PORT:-8080}"
    environment:
      - SPARK_FLASK_PORT=${SPARK_FLASK_PORT:-8080}
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-spark-flask-secret-key-change-in-prod}
      - DATABASE_URL=sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data

