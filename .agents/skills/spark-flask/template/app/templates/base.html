<!DOCTYPE html>
<html lang="en" data-theme="auto" data-archetype="{{ config.TYPOGRAPHY_ARCHETYPE }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <title>{% block title %}{{ config.APP_NAME }}{% endblock %}</title>

  <!-- Design Tokens, Typography (Self-hosted Google Sans Flex & Material Symbols), Layout, Components -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/typography.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">

  <!-- HTMX, Material Web Bridge & Client Scripts -->
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
  <script type="module" src="{{ url_for('static', filename='js/material-web.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/shortcuts.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="m3-app-scaffold">
  <!-- Accessibility: Skip to Content Link -->
  <a href="#workspace-container" class="skip-to-content">Skip to content</a>

  {% block shell %}{% endblock %}

  <!-- Keyboard Shortcuts Modal Sheet -->
  {% include 'components/_shortcuts_modal.html' %}

  <!-- Confirmation Dialog -->
  {% include 'components/_confirm_dialog.html' %}

  <!-- Global Snackbar Host for Undo and Toast notifications -->
  <div id="m3-snackbar-host" class="m3-snackbar-host" aria-live="polite"></div>
</body>
</html>
