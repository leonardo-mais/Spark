<dialog id="shortcuts-dialog" class="m3-dialog">
  <div class="dialog-container">
    <div class="dialog-header">
      <span class="material-symbols-rounded">keyboard</span>
      <h3 class="m3-headline-small">Keyboard Shortcuts</h3>
    </div>
    <div class="dialog-content">
      <div class="shortcut-row">
        <span class="shortcut-desc">Create new task</span>
        <kbd class="shortcut-key">c</kbd>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-desc">Focus global search</span>
        <kbd class="shortcut-key">/</kbd>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-desc">Open shortcuts sheet</span>
        <kbd class="shortcut-key">?</kbd>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-desc">Close dialog or drawer</span>
        <kbd class="shortcut-key">Esc</kbd>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="m3-text-button" onclick="document.getElementById('shortcuts-dialog').close()">Close</button>
    </div>
  </div>
</dialog>
