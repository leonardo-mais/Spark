<dialog id="confirm-dialog" class="m3-dialog">
  <div class="dialog-container">
    <div class="dialog-header">
      <span class="material-symbols-rounded">help_outline</span>
      <h3 class="m3-headline-small" id="confirm-dialog-title">Confirm Action</h3>
    </div>
    <div class="dialog-content">
      <p id="confirm-dialog-message" class="m3-body-medium">Are you sure you want to proceed?</p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="m3-text-button" onclick="closeConfirmDialog()">Cancel</button>
      <button type="button" class="m3-filled-button" id="confirm-dialog-action-btn">Confirm</button>
    </div>
  </div>
</dialog>
